[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biotwin-x"
version = "0.1.0"
description = "BioTwin.X — cross-modal contrastive digital twin for predictive cardiometabolic prognosis"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [
  { name = "Team BioTwin.X", email = "anikak206@gmail.com" },
]
keywords = ["digital-twin", "contrastive-learning", "hrv", "cgm", "cardiology"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
  "numpy>=2.1,<3",
  "pandas>=2.2,<4",
  "scipy>=1.13,<2",
  "scikit-learn>=1.5,<2",
  "pyarrow>=17",
  "torch>=2.4,<3",
  "streamlit>=1.40,<2",
  "plotly>=5.24,<8",
]

[project.optional-dependencies]
serve = ["fastapi>=0.115", "uvicorn>=0.32"]
eval = ["xgboost>=2.1,<4"]
dev = ["pytest>=8.3"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
